name: Noor
options:
  bundleIdPrefix: com.engagendy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, ar]

packages:
  DesignSystem:
    path: Core/DesignSystem
  ContentDB:
    path: Core/ContentDB
  Translations:
    path: Core/Translations
  QuranReader:
    path: Modules/QuranReader
  PrayerTimes:
    path: Modules/PrayerTimes
  QuranAudio:
    path: Modules/QuranAudio
  Notifications:
    path: Modules/Notifications
  Qibla:
    path: Modules/Qibla
  Tafsir:
    path: Modules/Tafsir
  Library:
    path: Modules/Library
  Athkar:
    path: Modules/Athkar

schemes:
  Noor:
    build:
      targets:
        Noor: all
        NoorTests: [test]
    test:
      targets: [NoorTests]
    run:
      config: Debug
      executable: Noor
    archive:
      config: Release

targets:
  NoorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/NoorTests]
    dependencies:
      - target: Noor
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES

  NoorWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widgets, Shared]
    dependencies:
      - package: PrayerTimes
      - package: ContentDB
      - package: DesignSystem
    info:
      path: Widgets/Info.plist
      properties:
        # Must match the host app exactly or App Store upload rejects it.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Noor Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engagendy.Noor.widgets
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 10
        DEVELOPMENT_TEAM: 7JM77223V5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/NoorWidgets.entitlements
        SWIFT_VERSION: 5.10
        SKIP_INSTALL: YES

  Noor:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - path: Shared
    dependencies:
      - package: DesignSystem
      - package: ContentDB
      - package: Translations
      - package: QuranReader
      - package: PrayerTimes
      - package: QuranAudio
      - package: Notifications
      - package: Qibla
      - package: Tafsir
      - package: Library
      - package: Athkar
      - target: NoorWidgets
        platformFilter: iOS
    info:
      path: App/Info.plist
      properties:
        # Single source of truth: the settings below. Without these keys
        # xcodegen writes its own defaults (1.0 / 1) into the generated
        # plist and every version bump silently disappears.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio, remote-notification]
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.reference
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Your location is used only on this device to calculate prayer times and qibla direction. It never leaves your device."
    settings:
      base:
        DEVELOPMENT_TEAM: 7JM77223V5
        CODE_SIGN_STYLE: Automatic
        # App group only on iOS (widget sharing); macOS build stays plain.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Noor.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Noor.entitlements
        # Mac App Store requires the sandbox; separate entitlements file.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/NoorMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: Noor
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 10
        SWIFT_VERSION: 5.10
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
