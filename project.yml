name: Noor
options:
  bundleIdPrefix: com.engagendy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, ar]

packages:
  DesignSystem:
    path: Core/DesignSystem
  ContentDB:
    path: Core/ContentDB
  Translations:
    path: Core/Translations
  QuranReader:
    path: Modules/QuranReader
  PrayerTimes:
    path: Modules/PrayerTimes
  QuranAudio:
    path: Modules/QuranAudio
  Notifications:
    path: Modules/Notifications
  Qibla:
    path: Modules/Qibla
  Tafsir:
    path: Modules/Tafsir
  Library:
    path: Modules/Library

targets:
  NoorWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widgets]
    dependencies:
      - package: PrayerTimes
      - package: ContentDB
      - package: DesignSystem
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Noor Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engagendy.Noor.widgets
        DEVELOPMENT_TEAM: 7JM77223V5
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.10
        SKIP_INSTALL: YES

  Noor:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
    dependencies:
      - package: DesignSystem
      - package: ContentDB
      - package: Translations
      - package: QuranReader
      - package: PrayerTimes
      - package: QuranAudio
      - package: Notifications
      - package: Qibla
      - package: Tafsir
      - package: Library
      - target: NoorWidgets
        platformFilter: iOS
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Your location is used only on this device to calculate prayer times and qibla direction. It never leaves your device."
    settings:
      base:
        DEVELOPMENT_TEAM: 7JM77223V5
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: Noor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.10
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
